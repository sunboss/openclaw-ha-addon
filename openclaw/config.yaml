name: "OpenClaw"
description: "Personal AI Assistant for Home Assistant — multi-channel chats, skills & live Control UI."
version: "2026.9.24.1"
slug: "openclaw"
init: false
startup: "application"
stage: "stable"
homeassistant_api: true
ingress: true
ingress_panel: true
ingress_port: 8099
panel_icon: "mdi:lobster"
arch:
  - aarch64
  - amd64
url: "https://github.com/sunboss/openclaw-ha-addon"
ports:
  18789/tcp: 18789
ports_description:
  18789/tcp: "OpenClaw Control UI 控制台与网关直连端口 (局域网秒开，免 Ingress 限制)"
map:
  - addon_config:rw
options:
  llm_model: "claude-3-7-sonnet"
  openai_base_url: "https://api.1234r.com/v1"
  openai_api_key: ""
  gateway_token: "openclaw-ha-addon-persistent-token-v1"
  telegram_bot_token: ""
  discord_bot_token: ""
schema:
  llm_model: "str?"
  openai_base_url: "url"
  openai_api_key: "password?"
  gateway_token: "password?"
  telegram_bot_token: "password?"
  discord_bot_token: "password?"
