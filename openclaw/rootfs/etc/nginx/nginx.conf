daemon off;
pid /tmp/nginx.pid;
worker_processes auto;
pcre_jit on;
error_log /tmp/nginx_error.log error;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    access_log    off;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;

    # 启用 Gzip 实时压缩与预编译 .gz 静态文件直发
    gzip              on;
    gzip_static       on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml
        font/woff2;

    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path       /tmp/nginx_proxy_temp;
    fastcgi_temp_path     /tmp/nginx_fastcgi_temp;
    uwsgi_temp_path       /tmp/nginx_uwsgi_temp;
    scgi_temp_path        /tmp/nginx_scgi_temp;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream openclaw_gateway {
        server 127.0.0.1:18790;
        keepalive 32;
    }

    # ── Ingress 端口 8099 ── 供 Home Assistant Supervisor 使用 ──────────
    server {
        listen 8099 default_server;

        root /usr/local/lib/node_modules/openclaw/dist/control-ui;
        server_name _;

        client_max_body_size 512m;

        # 允许 HA Supervisor 及 Docker 内部网段访问
        allow 172.30.0.0/16;
        allow 127.0.0.1;
        deny  all;

        # 静态资源直接由 Nginx 零拷贝 + gzip_static 极速返回，不走 Node.js
        location ~* ^/(assets|themes|fonts|app-art|cloud-provider-icons|community-art|file-icons|provider-icons)/ {
            gzip_static on;
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location ~* ^/(favicon\.svg|favicon-32\.png|favicon\.ico|apple-touch-icon\.png|social-card\.png|manifest\.webmanifest|asset-manifest\.json)$ {
            gzip_static on;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            try_files $uri =404;
        }

        location / {
            proxy_pass         http://openclaw_gateway;
            proxy_http_version 1.1;

            # WebSocket 支持与 Keepalive
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;

            # 重写 Host 与 Origin，确保 OpenClaw allowedOrigins 放行
            proxy_set_header   Host       127.0.0.1:18790;
            proxy_set_header   Origin     http://127.0.0.1:18790;

            # 彻底清空代理头，使 OpenClaw 识别为本地直连 (isLocalDirectRequest = true)
            proxy_set_header   X-Real-IP          "";
            proxy_set_header   X-Forwarded-For    "";
            proxy_set_header   X-Forwarded-Proto  "";
            proxy_set_header   X-Forwarded-Host   "";
            proxy_set_header   X-Forwarded-Port   "";
            proxy_set_header   X-Forwarded-Prefix "";
            proxy_set_header   Forwarded          "";
            proxy_set_header   Accept-Encoding    "";

            # 剥离上游可能返回的阻止 iframe 嵌入的头部
            proxy_hide_header  X-Frame-Options;
            proxy_hide_header  Content-Security-Policy;

            # 仅对主页面 HTML 做 Ingress 路径替换与免密自动连接，不再拦截大体积 JS
            sub_filter_once    off;
            sub_filter         'data-openclaw-control-ui-base-path=""' 'data-openclaw-control-ui-base-path="$http_x_ingress_path"';
            sub_filter         'href="/' 'href="$http_x_ingress_path/';
            sub_filter         'src="/'  'src="$http_x_ingress_path/';
            sub_filter         '</head>' '<script>window.__OPENCLAW_AUTO_TOKEN__="openclaw-ha-addon-persistent-token-v1";setInterval(()=>{const app=document.querySelector("openclaw-app");const root=app&&app.shadowRoot?app.shadowRoot:document;const inputs=Array.from(root.querySelectorAll("input"));const urlInp=inputs.find(i=>i.value&&i.value.startsWith("ws"));const directWs="ws://"+location.hostname+":18789";if(urlInp&&urlInp.value!==directWs){urlInp.value=directWs;urlInp.dispatchEvent(new Event("input",{bubbles:true}));urlInp.dispatchEvent(new Event("change",{bubbles:true}));}const inp=root.querySelector("input[type=password]");if(inp&&inp.value!==window.__OPENCLAW_AUTO_TOKEN__){inp.value=window.__OPENCLAW_AUTO_TOKEN__;inp.dispatchEvent(new Event("input",{bubbles:true}));inp.dispatchEvent(new Event("change",{bubbles:true}));}const btn=Array.from(root.querySelectorAll("button")).find(b=>b.innerText.includes("连接")||b.innerText.includes("Connect"));if(btn&&(urlInp||inp))btn.click();},400);</script></head>';

            proxy_buffering         off;
            proxy_cache             off;
            proxy_read_timeout      86400s;
            proxy_send_timeout      86400s;
            proxy_redirect          off;
        }
    }

    # ── 直连端口 18789 ── 局域网直接访问，极速秒开 ──────────────────────
    server {
        listen 18789 default_server;

        root /usr/local/lib/node_modules/openclaw/dist/control-ui;
        server_name _;

        client_max_body_size 512m;

        # 静态资源直接由 Nginx 零拷贝 + gzip_static 极速返回
        location ~* ^/(assets|themes|fonts|app-art|cloud-provider-icons|community-art|file-icons|provider-icons)/ {
            gzip_static on;
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        location ~* ^/(favicon\.svg|favicon-32\.png|favicon\.ico|apple-touch-icon\.png|social-card\.png|manifest\.webmanifest|asset-manifest\.json)$ {
            gzip_static on;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            try_files $uri =404;
        }

        location / {
            proxy_pass         http://openclaw_gateway;
            proxy_http_version 1.1;

            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       127.0.0.1:18790;
            proxy_set_header   Origin     http://127.0.0.1:18790;

            # 彻底清空代理头，使 OpenClaw 识别为本地直连 (isLocalDirectRequest = true)
            proxy_set_header   X-Real-IP          "";
            proxy_set_header   X-Forwarded-For    "";
            proxy_set_header   X-Forwarded-Proto  "";
            proxy_set_header   X-Forwarded-Host   "";
            proxy_set_header   X-Forwarded-Port   "";
            proxy_set_header   X-Forwarded-Prefix "";
            proxy_set_header   Forwarded          "";

            proxy_hide_header  X-Frame-Options;
            proxy_hide_header  Content-Security-Policy;

            proxy_set_header   Accept-Encoding    "";
            sub_filter_once    off;
            sub_filter         '</head>' '<script>window.__OPENCLAW_AUTO_TOKEN__="openclaw-ha-addon-persistent-token-v1";setInterval(()=>{const inp=document.querySelector("input[type=password]");if(inp&&!inp.value){inp.value=window.__OPENCLAW_AUTO_TOKEN__;inp.dispatchEvent(new Event("input",{bubbles:true}));inp.dispatchEvent(new Event("change",{bubbles:true}));const btn=Array.from(document.querySelectorAll("button")).find(b=>b.innerText.includes("连接")||b.innerText.includes("Connect"));if(btn)btn.click();}},300);</script></head>';

            proxy_buffering         off;
            proxy_cache             off;
            proxy_read_timeout      86400s;
            proxy_send_timeout      86400s;
            proxy_redirect          off;
        }
    }
}
