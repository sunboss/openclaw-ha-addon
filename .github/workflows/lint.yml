name: Home Assistant Add-on Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Validate config.yaml & scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Python scripts syntax
        run: python3 -m py_compile openclaw/scripts/*.py
      - name: Check Bash entrypoint syntax
        run: bash -n openclaw/run.sh
